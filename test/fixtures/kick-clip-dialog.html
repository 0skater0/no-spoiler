<!-- Clip dialog, opened from a clips list, reduced from the live site (Chrome, logged out, 2026-11-17).
     Its player shows current time and duration in one label. -->
<div role="dialog" id="radix-clip" data-state="open" data-nosnippet="true">
  <h2 id="radix-clip-title">Insane clutch</h2>
  <button data-scope="button" aria-label="Close" type="button" data-expect-visible><svg></svg></button>
  <div class="flex">
    <div class="group/player relative z-player">
      <div class="relative m-auto aspect-video h-full">
        <div class="absolute inset-0 z-player aspect-video"><div><video class="relative aspect-video h-full w-full" playsinline="" src="https://clips.kick.com/clips/xa/clip_01H.mp4"></video></div></div>
      </div>
      <div class="absolute inset-x-0 z-controls flex flex-row">
        <div class="flex flex-col gap-1.5 font-bold">
          <div class="flex items-center">
            <span title="Insane clutch" class="leading-[1.2]" data-expect-hidden="maskTitles">Insane clutch</span><span class="text-neutral">&nbsp;•&nbsp;</span><a href="/category/chess" data-expect-visible>Chess</a>
          </div>
          <span class="text-neutral text-sm leading-none">Clipped by <a href="/someclipper" data-expect-visible>someclipper</a>&nbsp;•&nbsp;<span><span title="5110" data-expect-visible>5.1K</span></span>&nbsp;Views</span>
        </div>
      </div>
      <div class="absolute inset-x-0 z-controls flex flex-row">
        <div class="flex flex-row items-center gap-2 lg:gap-0">
          <button data-scope="tooltip" aria-label="Pause (space)" type="button" data-expect-visible><svg></svg></button>
          <div class="group/volume flex items-center gap-2 xl:gap-4"><button aria-label="Unmute (m)" type="button"><svg></svg></button></div>
          <span class="px-1 text-sm font-semibold tabular-nums lg:px-2" data-expect-hidden="hideCurrentTime hideDuration">00:05 / 00:17</span>
        </div>
        <div class="flex flex-row items-center gap-2 lg:gap-0">
          <button aria-label="Fullscreen (f)" type="button" data-expect-visible><svg></svg></button>
        </div>
        <div class="group/seekbar absolute -top-7 left-0 h-5 w-full" data-expect-hidden="hideSeekbar">
          <div class="absolute top-2.5 w-full" data-expect-hidden="hideSeekbarPreview"><span class="absolute -top-10 rounded-md p-1 text-xs font-bold"></span></div>
          <div aria-valuemax="17" aria-valuemin="0" aria-valuenow="0" role="progressbar" data-state="loading" aria-label="Loaded progress"></div>
          <span dir="ltr" data-orientation="horizontal" aria-disabled="false">
            <span><span role="slider" aria-label="Current video time" aria-valuemin="0" aria-valuemax="17008" aria-valuenow="5440" tabindex="0"></span></span>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
