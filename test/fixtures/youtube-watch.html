<ytd-app>
  <ytd-watch-flexy>
    <div id="primary">
      <div id="movie_player" class="html5-video-player">
        <div class="html5-video-container"><video class="video-stream html5-main-video"></video></div>
        <div class="ytp-chrome-top"><a class="ytp-title-link" data-expect-hidden="maskTitles">Some video</a></div>
        <div class="ytp-chrome-bottom">
          <div class="ytp-progress-bar-container" data-expect-hidden="hideProgressBar">
            <div class="ytp-heat-map-container"></div>
            <div class="ytp-progress-bar" role="slider" aria-valuenow="83"></div>
          </div>
          <div class="ytp-chrome-controls">
            <div class="ytp-left-controls">
              <button class="ytp-play-button ytp-button" aria-label="Pause (k)" data-expect-visible></button>
              <a class="ytp-next-button ytp-button" data-expect-visible></a>
              <span class="ytp-volume-area" data-expect-visible></span>
              <div class="ytp-time-display notranslate" data-expect-hidden="hideVideoTime">
                <span class="ytp-time-wrapper">
                  <span class="ytp-time-current">1:23</span><span class="ytp-time-separator"> / </span
                  ><span class="ytp-time-duration">45:06</span>
                </span>
              </div>
              <div class="ytp-chapter-container" data-expect-hidden="hideProgressBar">
                <button class="ytp-chapter-title ytp-button">Final round</button>
              </div>
            </div>
            <div class="ytp-right-controls" data-expect-visible>
              <button class="ytp-button" data-tooltip-target-id="ytp-autonav-toggle-button">
                <div class="ytp-autonav-toggle-button-container">
                  <div class="ytp-autonav-toggle-button" aria-checked="true"></div>
                </div>
              </button>
              <button class="ytp-settings-button ytp-button"></button>
            </div>
          </div>
        </div>
        <div class="ytp-ce-element ytp-ce-video ytp-ce-top-left-quad" data-expect-hidden="hideEndcards"></div>
        <div class="html5-endscreen ytp-player-content videowall-endscreen" data-expect-hidden="hideEndcards">
          <div class="ytp-endscreen-content"></div>
        </div>
        <div class="ytp-autonav-endscreen-upnext-container" data-expect-hidden="hideEndcards"></div>
      </div>
      <div id="below">
        <ytd-watch-metadata>
          <div id="title"><h1 data-expect-hidden="maskTitles"><yt-formatted-string title="Some video">Some video</yt-formatted-string></h1></div>
          <div id="owner" data-expect-visible>Channel</div>
          <div id="description" data-expect-hidden="hideDescription">
            <ytd-text-inline-expander id="description-inline-expander">0:00 Intro 12:30 Final</ytd-text-inline-expander>
          </div>
        </ytd-watch-metadata>
        <ytd-comments id="comments" data-expect-hidden="hideComments"><div>Comment that spoils the ending</div></ytd-comments>
      </div>
    </div>
    <div id="secondary">
      <div id="chat-container" data-expect-hidden="hideChat">
        <ytd-live-chat-frame id="chat"><iframe></iframe></ytd-live-chat-frame>
      </div>
      <div id="related" data-expect-hidden="hideRecommendations">
        <ytd-watch-next-secondary-results-renderer>
          <ytd-compact-video-renderer>Next video</ytd-compact-video-renderer>
        </ytd-watch-next-secondary-results-renderer>
      </div>
    </div>
    <ytd-engagement-panel-section-list-renderer
      target-id="engagement-panel-macro-markers-description-chapters"
      data-expect-hidden="hideDescription"
    ></ytd-engagement-panel-section-list-renderer>
    <ytd-engagement-panel-section-list-renderer target-id="engagement-panel-structured-description" data-expect-visible
    ></ytd-engagement-panel-section-list-renderer>
  </ytd-watch-flexy>
</ytd-app>
