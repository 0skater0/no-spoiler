<!-- Reduced from a live twitch.tv video page (2026-11). -->
<div id="root">
  <main>
    <div data-a-target="video-player" class="video-player">
      <div data-a-target="video-ref"><video></video></div>
      <div data-a-target="player-overlay-video-recommendations" data-expect-hidden="hideEndRecommendations">
        <a href="/videos/222">Next video</a>
      </div>
      <div data-a-target="player-controls" class="player-controls" dir="ltr">
        <div>
          <div>
            <div class="tw-transition">
              <div role="dialog" class="Attached" data-expect-hidden="hideSeekbarPreview">
                <div class="ScBalloonWrapper">
                  <div data-test-selector="vod-seekbar-preview-overlay-preview-image"><img alt="" /></div>
                  <div><p>04:26:47</p></div>
                </div>
              </div>
            </div>
            <div class="vod-seekbar-time-labels" data-expect-hidden="hidePlayerTime">
              <p data-a-target="player-seekbar-current-time" data-expect-hidden="hidePlayerTime">03:02:12</p>
              <p data-a-target="player-seekbar-duration" data-a-value="39995.983" data-expect-hidden="hidePlayerTime">11:06:35</p>
            </div>
            <div data-test-selector="seekbar-interaction-area__interactionArea" data-a-target="player-seekbar" class="seekbar-interaction-area" data-expect-hidden="hideSeekbar">
              <div class="seekbar-bar">
                <span data-test-selector="seekbar-segment__segment" class="seekbar-segment" style="width: 27%"></span>
                <span data-test-selector="seekbar-segment__segment" class="seekbar-segment" style="width: 30%"></span>
                <span>
                  <div class="tw-transition">
                    <div class="seekbar-thumb" role="slider" tabindex="0"><p></p></div>
                  </div>
                </span>
              </div>
            </div>
          </div>
        </div>
        <section id="channel-player" aria-label="Player-Steuerung">
          <div>
            <div class="player-controls__left-control-group">
              <div class="play-wrapper">
                <div class="ScLayoutCssVars">
                  <button aria-label="Pause (Leerzeichen/k)" data-a-target="player-play-pause-button" data-a-player-state="playing" data-expect-visible></button>
                </div>
              </div>
              <div class="volume" data-expect-visible>
                <button data-a-target="player-mute-unmute-button"></button>
              </div>
            </div>
            <div class="player-controls__right-control-group" data-expect-visible>
              <button data-a-target="player-settings-button"></button>
              <button data-a-target="player-fullscreen-button"></button>
            </div>
          </div>
        </section>
      </div>
    </div>
    <!-- Video title on the page: markup not captured yet -->
    <div data-a-target="player-info">
      <h2 data-a-target="stream-title" title="Grand final, team A wins" data-expect-hidden="maskTitles">Grand final, team A wins</h2>
    </div>
  </main>
  <div class="right-column right-column--beside" role="complementary" data-a-target="right-column-chat-bar">
    <button data-a-target="right-column__toggle-collapse-btn" aria-label="Chat einklappen"></button>
    <aside id="live-page-chat" aria-label="Stream-Chat">
      <div class="channel-root__right-column channel-root__right-column--expanded">
        <div class="chat-shell chat-shell__expanded">
          <section class="video-chat">GG</section>
        </div>
      </div>
    </aside>
  </div>
</div>
