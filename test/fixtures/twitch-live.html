<!-- Live channel page. NOT yet verified against the live site: built from
     known class names only, replace with a reduced live snapshot. -->
<div id="root">
  <main>
    <div data-a-target="video-player" class="video-player">
      <video></video>
      <div data-a-target="player-controls">
        <button data-a-target="player-play-pause-button" data-expect-visible></button>
        <!-- Time label next to the LIVE badge, from the live site (Firefox, 2026-11-16) -->
        <div style="user-select: none;" class="Layout-sc-1xcs6mc-0 iKXhug">
          <p class="CoreText-sc-1txzju1-0 joAHyC" data-expect-hidden="hideLivePlayerTime">00:02:17</p>
        </div>
        <strong data-expect-visible>LIVE</strong>
      </div>
    </div>
    <div class="channel-info-content">
      <p data-a-target="stream-title" data-expect-hidden="maskTitles">Live stream title</p>
      <span class="live-time" data-expect-hidden="hideLiveUptime"><p>2:13:07</p></span>
    </div>
  </main>
  <!-- Right column as on the video page (same component) -->
  <div class="right-column right-column--beside" role="complementary" data-a-target="right-column-chat-bar">
    <button data-a-target="right-column__toggle-collapse-btn" aria-label="Chat einklappen"></button>
    <aside id="live-page-chat" aria-label="Stream-Chat">
      <div class="channel-root__right-column channel-root__right-column--expanded">
        <div class="chat-shell chat-shell__expanded">Chat</div>
      </div>
    </aside>
  </div>
</div>
