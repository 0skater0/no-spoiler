<!-- Live channel page. NOT yet verified against the live site: built from
     known class names only, replace with a reduced live snapshot. -->
<div id="root">
  <main>
    <div data-a-target="video-player" class="video-player">
      <video></video>
      <div data-a-target="player-controls">
        <button data-a-target="player-play-pause-button" data-expect-visible></button>
      </div>
    </div>
    <div class="channel-info-content">
      <p data-a-target="stream-title" data-expect-hidden="maskTitles">Live stream title</p>
      <span class="live-time" data-expect-hidden="hideLiveUptime"><p>2:13:07</p></span>
    </div>
  </main>
  <!-- Right column as on the video page (same component) -->
  <div class="right-column right-column--beside" role="complementary" data-a-target="right-column-chat-bar" data-expect-hidden="hideLiveChat">
    <aside id="live-page-chat" aria-label="Stream-Chat">
      <div class="chat-shell chat-shell__expanded" data-expect-hidden="hideLiveChat">Chat</div>
    </aside>
  </div>
</div>
