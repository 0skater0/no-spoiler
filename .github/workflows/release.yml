name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches package.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Lint (web-ext)
        run: npm run lint

      - name: Build and package
        run: npm run package

      - name: Extract changelog for this version
        run: >
          node -e "import('./scripts/lib/changelog.mjs').then((m) => require('fs').writeFileSync('release-notes.md',
          m.changelogSection('CHANGELOG.md', process.env.GITHUB_REF_NAME.slice(1))))"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.zip
          body_path: release-notes.md
          draft: false
          prerelease: false

      # Store uploads run only when the secrets are configured
      # (Settings -> Secrets and variables -> Actions). See docs/STORE.md.
      - name: Submit to addons.mozilla.org
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: node scripts/publish-firefox.mjs

      - name: Submit to the Chrome Web Store
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        if: env.CWS_EXTENSION_ID != '' && env.CWS_REFRESH_TOKEN != ''
        run: node scripts/publish-chrome.mjs
