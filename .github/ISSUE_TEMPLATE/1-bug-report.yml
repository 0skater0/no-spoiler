name: Bug report
description: Create a report to help improve No Spoilers - Youtube
labels: ["bug"]
title: "[Bug]: "
body:
  - type: checkboxes
    id: pre-check
    attributes:
      label: Pre-check
      description: "You must confirm **all** of the following before you can submit this report."
      options:
        - label: I have searched the [existing issues](https://github.com/0skater0/Firefox-No-Spoiler/issues) and this bug has not been reported yet.
          required: true
        - label: I have tested with the latest version of the extension.
          required: true
  - type: textarea
    id: describe-the-bug
    attributes:
      label: Describe the bug
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe the issue"
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce
      description: "Steps to reproduce the behavior."
      placeholder: |
        1. Open YouTube
        2. Navigate to a video
        3. Enable the extension
        4. Click on [...]
        5. See the issue
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: "A clear and concise description of what you expected to happen."
      placeholder: "The behavior that I expect to see is [...]"
    validations:
      required: true
  - type: input
    id: youtube-url
    attributes:
      label: YouTube URL
      description: "The YouTube URL where the issue occurs (if applicable)."
      placeholder: "e.g. https://www.youtube.com/watch?v=..."
    validations:
      required: false
  - type: dropdown
    id: frequency
    attributes:
      label: How often does this occur?
      options:
        - Always (every time)
        - Sometimes (intermittent)
        - Only once
      default: 0
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: "Found in `about:addons` → No Spoilers: Youtube"
      placeholder: "e.g. 0.9.9"
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser and version
      description: "Your browser name and version (e.g. Firefox 135, Chrome 122)."
      placeholder: "e.g. Firefox 135.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
      default: 0
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Videos
      description: "If applicable, add screenshots or short screen recordings to help explain the problem."
    validations:
      required: false
  - type: textarea
    id: console-errors
    attributes:
      label: Console errors
      description: "Open the Developer Console (`Ctrl+Shift+I` on Windows/Linux, `Cmd+Option+I` on macOS), click the Console tab, and paste any error messages related to the extension."
      render: shell
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: "Add any other context about the problem here (other extensions installed, YouTube settings, etc.)."
      placeholder: "Also note that [...]"
    validations:
      required: false
